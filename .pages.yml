# Configurazione di Pages CMS (app.pagescms.org): definisce cosa Eugenio può modificare e come.
# Ogni salvataggio crea un commit su GitHub; il workflow "Pubblica il sito" rigenera il sito in circa un minuto.
media:
  input: foto/caricate
  output: /foto/caricate
  extensions: [jpg, jpeg, png, webp]
  rename: safe

settings:
  commit:
    identity: user
    templates:
      update: "Aggiornato {path} dal CMS"
      create: "Aggiunto {path} dal CMS"

content:
  - name: profilo
    label: Profilo
    type: file
    path: contenuti/profilo.json
    format: json
    operations: { delete: false }
    fields:
      - { name: nome, label: Nome, type: string, required: true }
      - { name: sottotitolo, label: Riga sotto il nome, type: string, required: true, description: "Le parole «Avventure nel Mondo» diventano un link da sole." }
      - { name: foto_oggi, label: Foto principale, type: image, description: "La foto che si vede aprendo il sito. Meglio verticale, con te ben visibile." }
      - { name: descrizione_foto_oggi, label: Descrizione della foto, type: string, description: "Per chi non vede le immagini (es. «Sugli scogli al tramonto, con una tazza in mano»)." }
      - { name: inquadratura_oggi, label: Inquadratura della foto, type: number, options: { min: 0, max: 100 }, description: "0 = mostra il lato sinistro della foto, 50 = centro, 100 = lato destro." }
      - { name: riga_oggi, label: Riga di oggi, type: string, description: "Sotto «Oggi». La prossima partenza viene aggiunta in automatico." }
      - { name: bio_attacco, label: Frase d'apertura (facoltativa), type: string, description: "Se la scrivi compare in corsivo sopra la presentazione. Se c'è una citazione, vince la citazione." }
      - { name: citazione, label: Citazione (facoltativa), type: text, description: "Qualche verso o una frase d'autore, una riga per verso. Se c'è, prende il posto della frase d'apertura." }
      - { name: citazione_autore, label: Autore della citazione, type: string }
      - { name: bio, label: Presentazione, type: text, description: "Lascia una riga vuota tra un paragrafo e l'altro." }
      - { name: motto, label: Motto in fondo alla pagina, type: string }
      - { name: instagram, label: Nome utente Instagram, type: string, description: "Senza @." }
      - { name: whatsapp, label: Numero WhatsApp, type: string, description: "Se lo inserisci, il pulsante principale diventa «Scrivimi su WhatsApp»." }
      - { name: messaggio_whatsapp, label: Messaggio WhatsApp già scritto, type: string }
      - { name: email, label: Email, type: string }
      - { name: descrizione_sito, label: Descrizione per Google e per le anteprime dei link, type: text }
      - { name: indirizzo_sito, label: Indirizzo del sito, type: string, description: "Es. https://eugeniolucarelli.it. Serve per l'anteprima del link su WhatsApp." }
      - { name: online_su_google, label: Visibile su Google, type: boolean, description: "Lascia spento finché il sito non è pronto." }
      - { name: link_decalogo, label: Link al decalogo di Avventure, type: string, description: "Compare sotto le partenze come «Prima di partire»." }
      - { name: mostra_mappa, label: Mostra la mappa dei paesi, type: boolean, default: false }
      - name: recensioni
        label: Dal gruppo (frasi di chi ha viaggiato con te)
        type: object
        list: true
        description: "2 o 3 frasi vere, scritte da partecipanti. Se la lista è vuota la sezione non compare."
        fields:
          - { name: testo, label: Frase, type: text, required: true }
          - { name: nome, label: Nome di battesimo, type: string, required: true }
          - { name: viaggio, label: Viaggio e anno, type: string, description: "Es. Marrakech Discovery 2025." }
      - name: domande
        label: Com'è viaggiare con me (domande e risposte)
        type: object
        list: true
        description: "3 o 4 domande che ti fanno prima di iscriversi, con la tua risposta. Se la lista è vuota la sezione non compare."
        fields:
          - { name: domanda, label: Domanda, type: string, required: true }
          - { name: risposta, label: Risposta, type: text, required: true }

  - name: partenze
    label: Prossime partenze
    type: file
    path: contenuti/partenze.json
    format: json
    list: true
    fields:
      - { name: titolo, label: Nome del viaggio, type: string, required: true, description: "Come sul sito di Avventure (es. Finlandia Aurore Boreali Discovery)." }
      - { name: destinazione, label: Destinazione breve, type: string, required: true, description: "Quella grande sulla carta d'imbarco (es. Finlandia)." }
      - { name: tappe, label: Tappe, type: string, description: "Es. Helsinki, Ivalo, Rovaniemi." }
      - { name: descrizione, label: Descrizione, type: text, description: "Due o tre righe sul viaggio: compaiono sulla carta d'imbarco e sulla linea del tempo." }
      - { name: da, label: Città di partenza, type: string, default: Roma }
      - { name: dal, label: Partenza, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: al, label: Ritorno, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: codice, label: Codice partenza Avventure, type: string, description: "Le 4 cifre della partenza (es. 3597, 0791). Con il codice, iscritti e posti si aggiornano da soli ogni giorno." }
      - { name: tour_leader, label: Sono il tour leader, type: boolean, default: true }
      - name: timbro
        label: Timbro
        type: select
        description: "Il tuo logo sulla carta d'imbarco, al posto di «Tour leader: Eugenio»."
        options:
          values:
            - { value: "", label: Nessuno }
            - { value: freddo, label: Freddo (montagne e neve) }
            - { value: natura, label: Natura (giungla e animali) }
            - { value: mare, label: Mare (spiaggia e palme) }
      - { name: scheda, label: Link alla scheda del viaggio, type: string }
      - { name: iscrizione, label: Link per iscriversi, type: string, description: "Il link del pulsante «Prenota» di quella data sul sito di Avventure." }
      - { name: colore, label: Colore della carta d'imbarco, type: string, default: "#2b3caa", description: "Formato #RRGGBB, scuro (il testo sopra è bianco)." }
      - { name: foto, label: Foto di sfondo della carta d'imbarco, type: image, description: "Facoltativa. Un paesaggio della destinazione." }
      - { name: tabellone, label: Scritta del tabellone, type: string, description: "Facoltativa. Se vuota si usa la destinazione. Va a capo da sola tra le parole (al massimo 11 lettere per riga); con / scegli tu dove andare a capo." }
      - { name: minimo, label: Iscritti minimi per partire, type: number, default: 3, description: "Sotto questo numero la carta dice «Si parte con N iscritti»." }
      - { name: mostra_in_viaggio, label: Mostra «Adesso sono in viaggio» durante questo viaggio, type: boolean, default: false }
      - { name: posti, label: Posti (solo se il codice non basta), type: number }
      - { name: iscritti, label: Iscritti (solo se il codice non basta), type: number }

  - name: viaggi
    label: Viaggi fatti
    type: file
    path: contenuti/viaggi.json
    format: json
    list: true
    fields:
      - { name: titolo, label: Titolo, type: string, required: true }
      - name: tipo
        label: Tipo di viaggio
        type: select
        default: gruppo
        description: "Di gruppo: sta sulla linea del tempo e nella griglia. In autonomia: nella fila «In autonomia»."
        options:
          values:
            - { value: gruppo, label: Di gruppo (Avventure nel Mondo) }
            - { value: personale, label: In autonomia }
      - { name: dal, label: Partenza, type: string, description: "AAAA-MM-GG (es. 2024-08-28). Se ricordi solo il mese: AAAA-MM (es. 2023-01). Obbligatoria per i viaggi di gruppo." }
      - { name: al, label: Ritorno, type: string, description: "AAAA-MM-GG. Facoltativo." }
      - { name: tour_leader, label: Ero il tour leader, type: boolean, default: false }
      - name: timbro
        label: Timbro (solo per i viaggi da tour leader)
        type: select
        description: "Il logo che compare sulla foto quando il viaggio è scelto sulla linea del tempo."
        options:
          values:
            - { value: "", label: Nessuno }
            - { value: freddo, label: Freddo (montagne e neve) }
            - { value: natura, label: Natura (giungla e animali) }
            - { value: mare, label: Mare (spiaggia e palme) }
      - { name: mostra, label: Mostra sul sito, type: boolean, default: true, description: "Per i viaggi in autonomia: spento, il viaggio resta salvato ma non compare." }
      - { name: paese, label: Paese, type: string, description: "In italiano, per la mappa e per contare i paesi (es. Spagna anche per Tenerife). Più paesi separati da virgola (es. Montenegro, Croazia)." }
      - { name: foto, label: Foto, type: image, description: "Una foto in cui ci sei tu. Viene ridimensionata e ripulita dai dati GPS in automatico." }
      - { name: inquadratura, label: Inquadratura della foto, type: number, default: 50, options: { min: 0, max: 100 }, description: "0 = lato sinistro, 50 = centro, 100 = lato destro." }
      - { name: colore, label: Colore (facoltativo), type: string, description: "Se lo lasci vuoto viene preso dalla foto." }
      - { name: riga, label: Descrizione, type: text, description: "Due o tre righe sul viaggio. Le date si aggiungono da sole." }
      - { name: frase, label: Una tua frase su questo viaggio, type: string, description: "Facoltativa. Compare in corsivo." }
      - { name: scheda, label: Link alla scheda del viaggio, type: string }
      - { name: video, label: Link al video (reel Instagram), type: string, description: "Facoltativo. Incolla il link del reel, es. https://www.instagram.com/reel/XXXX/. Sul sito compare il pulsante «Guarda il video»." }
      - { name: credito_foto, label: Credito della foto, type: string, description: "Solo se la foto non è tua. Es. «Foto di Mario Rossi, CC BY 4.0». Compare in fondo alla pagina." }
      - { name: link_credito, label: Link della foto originale, type: string, description: "Facoltativo: la pagina da cui viene la foto." }
