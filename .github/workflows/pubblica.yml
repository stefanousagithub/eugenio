# Rigenera e pubblica il sito su GitHub Pages:
# - a ogni modifica (anche dal CMS),
# - ogni mattina, per aggiornare iscritti e posti dal sito di Avventure e spostare le partenze concluse tra i viaggi fatti,
# - a mano dalla scheda Actions.
# In Settings → Pages scegli "GitHub Actions" come sorgente.
name: Pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
